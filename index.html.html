<!DOCTYPE html>

        * {

            padding: 0;
            box-sizing: border-box;
            user-select: none;

            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .stage {
            position: relative;

        #danmakuCanvas {

            pointer-events: none;

        .ai-summary {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;

            backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 8px 24px;
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid #00f2ff;
            font-size: 14px;
            color: #eef5ff;
            pointer-events: none;
            font-weight: 500;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);

            background: linear-gradient(135deg, #0a84ff, #00c3ff);

            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 16px;

            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
        }

            background: rgba(255, 200, 50, 0.2);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 12px;
            color: #ffdf7e;
            font-weight: 500;
        }

        .zone-effect {
            position: absolute;
            bottom: 140px;
            right: 30px;

</head>

    // ---------- 固定轨道系统 (6条独立轨道，防止重叠) ----------
    const TRACK_COUNT = 6;
    let trackOccupancy = new Array(TRACK_COUNT).fill(null);
    const TRACK_HEIGHT_RATIO = [0.12, 0.24, 0.36, 0.5, 0.64, 0.78];

    function getAvailableTrack(danmakuWidth) {
        let bestTrack = 0;
        let maxGap = -Infinity;
        for (let i = 0; i < TRACK_COUNT; i++) {
            let lastEndX = trackOccupancy[i] || 0;
            let gap = lastEndX - danmakuWidth;
            if (gap > maxGap) {
                maxGap = gap;
                bestTrack = i;
            }
        }
        return bestTrack;
    }

    function refreshTrackOccupancy() {
        for (let i = 0; i < TRACK_COUNT; i++) trackOccupancy[i] = null;
        for (let d of danmakuList) {
            if (d.track !== undefined) {
                let currentEdge = d.x - d.width;
                if (trackOccupancy[d.track] === null || currentEdge > trackOccupancy[d.track]) {
                    trackOccupancy[d.track] = currentEdge;

        }
    }

    // 敏感词过滤

    function hasSensitive(text) { let t = text.toLowerCase(); return sensitiveWords.some(word => t.includes(word)); }

        if (/(未来|想像|幻想|科幻|创意|创造)/i.test(text)) tags.push('#未来畅想');
        if (/(机器人|机械|自动|无人驾驶)/i.test(text)) tags.push('#机器人纪元');
        if (/(伦理|安全|隐私|情感|理解)/i.test(text)) tags.push('#AI伦理');
        if (/(深度学习|神经网络|算法|训练)/i.test(text)) tags.push('#技术深潜');
        if (tags.length === 0) tags.push('#趣味脑洞');
        tags = tags.slice(0, 2);
        const colorMap = { excited: '#ffb347', think: '#3b9eff', wow: '#c55aff' };
        return { tags, color: colorMap[emotion] || '#6effb0' };
    }

    function triggerKeywordEgg(text) {
        const lower = text.toLowerCase();
        if (/(神经网络|深度学习|机器人|大模型)/i.test(lower)) {
            const zoneDiv = document.getElementById('zoneTip');
            zoneDiv.style.transform = 'scale(1.02)';
            zoneDiv.style.borderRightColor = '#ffcc77';
            setTimeout(() => { zoneDiv.style.transform = 'scale(1)'; zoneDiv.style.borderRightColor = '#ffaa44'; }, 400);
        }
        if (/(机器人|机器臂|仿生)/i.test(text)) {
            const zoneDiv = document.getElementById('zoneTip');
            zoneDiv.style.opacity = '0.9';
            setTimeout(() => zoneDiv.style.opacity = '1', 250);
        }
    }

    const robotNames = ['智谱观察员', '算力探索者', 'AI漫游者', '硅基旅人', '深度好奇猫', '神经云', '未来信使', '量子幽灵', '灵感星人'];
    function getRandomNickname() { return robotNames[Math.floor(Math.random() * robotNames.length)] + '_' + Math.floor(Math.random() * 100); }

    function createDanmakuObj(text, nickname, emotion, avatar, customColor, aiTags, trackIdx) {
        let speed = 0.75 + Math.random() * 0.8;   // 速度平缓，不头晕
        let y = height * (TRACK_HEIGHT_RATIO[trackIdx] || 0.4);
        let x = width;
        let fontSize = 20 + Math.random() * 6;
        return { text, nickname, emotion, avatar, aiTags, x, y, speed, fontSize, color: customColor, width: 0, displayText: '', track: trackIdx };
    }

    function measureTextWidth(text, fontSize) {
        ctx.font = `${fontSize}px "Segoe UI", "Poppins", system-ui`;
        return ctx.measureText(text).width;
    }

    function addDanmakuToScreen(danmaku) {
        if (emergency) return false;
        if (paused) return false;
        if (danmakuList.length >= MAX_ONSCREEN) {
            queue.push(danmaku);
            return false;
        }
        let display = `${danmaku.avatar} ${danmaku.nickname}: ${danmaku.text} ${danmaku.aiTags.join(' ')}`;
        danmaku.displayText = display;
        danmaku.width = measureTextWidth(display, danmaku.fontSize) + 30;
        let conflict = false;
        for (let d of danmakuList) {
            if (d.track === danmaku.track && Math.abs(d.x - width) < danmaku.width + 50) {
                conflict = true;
                break;
            }
        }
        if (conflict) return false;
        danmaku.x = width;
        danmaku.y = height * TRACK_HEIGHT_RATIO[danmaku.track] + (Math.random() * 6 - 3);
        danmakuList.push(danmaku);
        return true;
    }

    function replenishQueue() {
        if (emergency) return;
        for (let i = 0; i < queue.length && danmakuList.length < MAX_ONSCREEN; i++) {
            let candidate = queue[i];
            let conflict = false;
            for (let d of danmakuList) {
                if (d.track === candidate.track && Math.abs(d.x - width) < candidate.width + 50) {
                    conflict = true; break;
                }
            }
            if (!conflict) {
                queue.splice(i,1);
                addDanmakuToScreen(candidate);
                i--;
            }
        }
    }

    function clearScreen() { danmakuList = []; queue = []; refreshTrackOccupancy(); }

    function updateCanvas() {
        if (!ctx) return;
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < danmakuList.length; i++) {
            let d = danmakuList[i];
            if (!paused && !emergency) d.x -= d.speed;
            if (d.x + d.width < 0) {
                danmakuList.splice(i, 1);
                i--;
                continue;
            }
            ctx.font = `${d.fontSize}px "Segoe UI", "Poppins", system-ui`;
            ctx.shadowBlur = 3;
            ctx.shadowColor = "rgba(0,0,0,0.3)";
            ctx.fillStyle = d.color;
            ctx.fillText(d.displayText, d.x, d.y);
        }
        ctx.shadowBlur = 0;
        refreshTrackOccupancy();
        replenishQueue();
    }

    function animate() { updateCanvas(); animationId = requestAnimationFrame(animate); }

    let summaryInterval;
    function startSummaryWorker() {
        summaryInterval = setInterval(() => {
            if (allDanmakuHistory.length === 0) return;
            const recent = allDanmakuHistory.slice(-55);
            let wordMap = new Map();
            recent.forEach(item => {
                let words = item.text.split(/[\s,，。！？、]+/);
                words.forEach(w => { if (w.length >= 2 && !/[\d\W]/.test(w)) wordMap.set(w, (wordMap.get(w)||0)+1); });
            });
            let sorted = Array.from(wordMap.entries()).sort((a,b)=>b[1]-a[1]).slice(0,3);
            let hotWord = sorted.length ? sorted[0][0] : "创造力";
            document.getElementById('summaryText').innerHTML = `✨ 热议风向 · ${hotWord} ${sorted.length>1 ? ' / '+sorted[1][0] : ''}  · 思潮涌动`;
            document.getElementById('hotTag').innerHTML = `🔥 热词: ${hotWord}`;
        }, 28000);
    }

    const lastSendMap = new Map();
    function showToast(msg) { let t = document.createElement('div'); t.className = 'toast-msg'; t.innerText = msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2000); }

    function sendDanmaku(text, nickname, emotion, avatar, isSimulate = false) {
        if (emergency || globalPausedReceive) return false;
        if (!isSimulate) {
            const sessionKey = "visitor_" + (localStorage.getItem('sessionSeed') || Date.now());
            if (!localStorage.getItem('sessionSeed')) localStorage.setItem('sessionSeed', sessionKey);
            let last = lastSendMap.get(sessionKey) || 0;
            if (Date.now() - last < 6000) { showToast("⏳ 6秒内仅可发一条"); return false; }
            if (!text || text.trim() === "") { showToast("内容不能为空"); return false; }
            if (hasSensitive(text)) { showToast("内容不符合规范"); return false; }
            lastSendMap.set(sessionKey, Date.now());
        }
        let finalNick = (nickname && nickname.trim()) ? nickname.trim().slice(0,14) : getRandomNickname();
        let { tags, color } = getAITagsAndColor(text, emotion);
        let dummyWidth = measureTextWidth(`${avatar} ${finalNick}: ${text} ${tags.join(' ')}`, 24);
        let track = getAvailableTrack(dummyWidth);
        let danmaku = createDanmakuObj(text, finalNick, emotion, avatar, color, tags, track);
        let display = `${avatar} ${finalNick}: ${text} ${tags.join(' ')}`;
        danmaku.displayText = display;
        danmaku.width = measureTextWidth(display, danmaku.fontSize) + 30;
        let added = addDanmakuToScreen(danmaku);
        if (!added) queue.push(danmaku);
        allDanmakuHistory.push({ text, nickname: finalNick, emotion, aiTags: tags, timestamp: Date.now() });
        if (allDanmakuHistory.length > 500) allDanmakuHistory.shift();
        triggerKeywordEgg(text);
        if (!isSimulate) showToast(`🚀 发射成功！${finalNick}`);
        return true;
    }

    function startInfiniteSimulation() {
        if (window.simInterval) clearInterval(window.simInterval);
        window.simInterval = setInterval(() => {
            if (emergency || globalPausedReceive) return;
            let rand = FINAL_MOCK_LIB[Math.floor(Math.random() * FINAL_MOCK_LIB.length)];
            let suffix = Math.floor(Math.random() * 60);
            sendDanmaku(rand.text, rand.nickHint + suffix, rand.emotion, rand.avatar, true);
        }, 3400);
    }

    function initUI() {
        const avatarsList = ['🤖', '🧠', '⚡', '💡', '🚀', '👾', '🔮', '🖥️', '🌈', '✨'];
        let selectedAvatar = '🤖';
        const gallery = document.getElementById('avatarGallery');
        avatarsList.forEach(av => {
            let span = document.createElement('div');
            span.className = 'avatar-option'; span.innerText = av;
            span.onclick = () => { selectedAvatar = av; document.querySelectorAll('.avatar-option').forEach(el=>el.classList.remove('selected-avatar')); span.classList.add('selected-avatar'); };
            if(av === selectedAvatar) span.classList.add('selected-avatar');
            gallery.appendChild(span);
        });
        let currentEmotion = 'excited';
        document.querySelectorAll('.emotion-chip').forEach(btn => {
            btn.onclick = () => { currentEmotion = btn.getAttribute('data-emotion'); document.querySelectorAll('.emotion-chip').forEach(b=>b.classList.remove('active-emotion')); btn.classList.add('active-emotion'); updatePreview(); };
            if(btn.getAttribute('data-emotion') === 'excited') btn.classList.add('active-emotion');
        });
        const msgInput = document.getElementById('msgInput');
        const previewSpan = document.getElementById('previewTags');
        function updatePreview() { let { tags } = getAITagsAndColor(msgInput.value || "AI", currentEmotion); previewSpan.innerText = tags.join(' · '); }
        msgInput.addEventListener('input', updatePreview);
        updatePreview();
        document.getElementById('sendBtn').onclick = () => {
            let msg = msgInput.value.trim();
            let nick = document.getElementById('nicknameInput').value.trim();
            if(msg) sendDanmaku(msg, nick, currentEmotion, selectedAvatar, false);
            if(msg) msgInput.value = '';
            updatePreview();
        };
        document.getElementById('clearBtn').onclick = () => { clearScreen(); showToast("屏幕已清空"); };
        document.getElementById('pauseResumeBtn').onclick = () => { paused = !paused; document.getElementById('pauseResumeBtn').innerHTML = paused ? "▶️ 启动" : "⏸️ 暂停"; showToast(paused ? "弹幕暂停" : "流动恢复"); };
        document.getElementById('emergencyStopBtn').onclick = () => { emergency = !emergency; if(emergency){ clearScreen(); queue=[]; globalPausedReceive=true; showToast("紧急关停"); } else { globalPausedReceive=false; showToast("恢复正常"); } };
        let modeBtn = document.getElementById('modeSwitchBtn');
        modeBtn.onclick = () => {
            if(currentMode === 'free') { currentMode='lecture'; danmakuList = danmakuList.slice(0,Math.floor(danmakuList.length/2)); document.getElementById('modeLabel').innerHTML="🎓 科普讲解"; modeBtn.innerHTML="🔄 自由模式"; showToast("讲解模式: 低密度"); }
            else { currentMode='free'; document.getElementById('modeLabel').innerHTML="🎨 自由互动"; modeBtn.innerHTML="🔄 讲解模式"; showToast("自由互动模式"); }
        };
    }

    function resizeCanvas() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; clearScreen(); refreshTrackOccupancy(); }
    window.addEventListener('resize', () => { resizeCanvas(); });

    function init() {
        resizeCanvas();
        initUI();
        startSummaryWorker();
        animate();
        startInfiniteSimulation();
        setTimeout(()=>sendDanmaku("欢迎来到AI展厅，一起脑洞大开！","展厅大使","excited","🤖",true),1000);
        setTimeout(()=>sendDanmaku("AI让创造没有边界，快来留言吧","未来导览员","think","🧠",true),3200);
    }
    init();
</script>
